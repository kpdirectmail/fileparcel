name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please look through [existing issues](https://github.com/kpdirectmail/fileparcel/issues)
        first, in case someone asked for the same thing; a thumbs-up reaction there helps too.

        FileParcel aims to stay one small program that is private by default and easy to run at home or
        in a small office, so not every idea will fit, but every one is read.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
      placeholder: "When I share a folder with my family, I would like to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How it could work, in the web app, in the `fileparcel` command, or both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use today, or how other tools solve it.
  - type: input
    id: version
    attributes:
      label: FileParcel version
      description: The output of `fileparcel version`, if you are already running FileParcel.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md).
